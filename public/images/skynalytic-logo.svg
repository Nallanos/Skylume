<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient pour la bulle -->
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient pour le papillon -->
    <linearGradient id="butterflyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bulle principale -->
  <circle cx="60" cy="60" r="56" fill="url(#bubbleGradient)" stroke="white" stroke-width="4" />
  
  <!-- Courbe croissante en 3 phases : croît → stable → croît -->
  <path d="M 16 90 Q 30 70 44 64 L 60 62 L 76 60 Q 90 50 104 36" stroke="white" stroke-width="6" fill="none" opacity="0.9" stroke-linecap="round" />
  
  <!-- Points de données - 3 phases -->
  <circle cx="16" cy="90" r="5" fill="white" opacity="0.8" />
  <circle cx="44" cy="64" r="5" fill="white" opacity="0.9" />
  <circle cx="60" cy="62" r="5" fill="white" opacity="0.8" />
  <circle cx="76" cy="60" r="5" fill="white" opacity="0.8" />
  <circle cx="104" cy="36" r="5" fill="white" />
  
  <!-- Papillon bleu - plus gros -->
  <!-- Corps du papillon -->
  <ellipse cx="60" cy="40" rx="2.4" ry="10" fill="#1E40AF" />
  
  <!-- Ailes supérieures -->
  <ellipse cx="52" cy="36" rx="8" ry="7" fill="url(#butterflyGradient)" opacity="0.9" />
  <ellipse cx="68" cy="36" rx="8" ry="7" fill="url(#butterflyGradient)" opacity="0.9" />
  
  <!-- Ailes inférieures -->
  <ellipse cx="53" cy="44" rx="5.6" ry="5" fill="url(#butterflyGradient)" opacity="0.7" />
  <ellipse cx="67" cy="44" rx="5.6" ry="5" fill="url(#butterflyGradient)" opacity="0.7" />
  
  <!-- Antennes -->
  <path d="M 58 30 Q 55 26 52 24" stroke="#1E40AF" stroke-width="2" fill="none" />
  <path d="M 62 30 Q 65 26 68 24" stroke="#1E40AF" stroke-width="2" fill="none" />
  <circle cx="52" cy="24" r="1.4" fill="#1E40AF" />
  <circle cx="68" cy="24" r="1.4" fill="#1E40AF" />
</svg>
