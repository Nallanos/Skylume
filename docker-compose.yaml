version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgresql
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`bluesky-bot.com`)
      - traefik.http.services.app.loadbalancer.server.port=8081
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=myresolver
    networks:
      - bluesky-copilot_default

  postgresql:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_USER: blueskybluesky
      POSTGRES_PASSWORD: blueskybluesky
      POSTGRES_DB: blueskybluesky
    ports:
      - 5432:5432
    volumes:
      - ./psqlrc:/root/.psqlrc
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - bluesky-copilot_default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blueskybluesky']
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7.4.1-alpine
    ports:
      - 6379:6379
    networks:
      - bluesky-copilot_default
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
      timeout: 5s

  reverse-proxy:
    image: traefik:v3.3
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entryPoints.web.address=:80'
      - '--entryPoints.websecure.address=:443'
      - '--certificatesresolvers.myresolver.acme.httpchallenge=true'
      - '--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web'
      #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - '--certificatesresolvers.myresolver.acme.email=benameurallan06@gmail.com'
      - '--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json'
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    labels:
      - traefik.enable=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - './letsencrypt:/letsencrypt'
    networks:
      - bluesky-copilot_default

volumes:
  postgresql_data:

networks:
  bluesky-copilot_default:
    driver: bridge
