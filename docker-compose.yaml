version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=UTC
      - PORT=8081
      - HOST=0.0.0.0
      - LOG_LEVEL=info # Passage en level info pour la production
      - APP_KEY=QU3bPZtVbBgV3Hjl5YSazM_UCp505C_x
      - NODE_ENV=production
      - SESSION_DRIVER=cookie
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=blueskybluesky
      - DB_PASSWORD=blueskybluesky
      - DB_DATABASE=blueskybluesky
      - QUEUE_REDIS_HOST=redis
      - QUEUE_REDIS_PORT=6379
      - QUEUE_REDIS_PASSWORD=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      - postgresql
      - redis
    networks:
      - caddy_network
      - backend_network
    # Plus besoin d'exposer le port, géré par le reverse proxy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
      interval: 30s
      timeout: 10s
      retries: 3

  postgresql:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_USER: blueskybluesky
      POSTGRES_PASSWORD: blueskybluesky
      POSTGRES_DB: blueskybluesky
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blueskybluesky']
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7.4.1-alpine
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
      timeout: 5s

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_network
    depends_on:
      - app

volumes:
  postgresql_data:
  caddy_data:
  caddy_config:

networks:
  caddy_network:
    driver: bridge
  backend_network:
    driver: bridge
