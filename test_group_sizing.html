<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Sizing Logic Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .scenario {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .grid {
        display: grid;
        gap: 10px;
        margin: 10px 0;
      }
      .group {
        border: 2px solid #8b5cf6;
        border-radius: 8px;
        padding: 10px;
        background: rgba(139, 92, 246, 0.1);
      }
      .cluster {
        width: 80px;
        height: 60px;
        background: #3b82f6;
        color: white;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Audience Flow Chart - Group Sizing Logic Test</h1>
    <p>
      This demonstrates how the improved group sizing logic adapts to different numbers of super
      clusters and sub-clusters.
    </p>

    <div id="scenarios"></div>

    <script>
      // Simulate the group sizing logic from AudienceFlowChart.tsx
      function calculateLayout(totalSuperClusters, clustersPerGroup) {
        // Constants from the component
        const clusterNodeWidth = 260
        const clusterNodeHeight = 200
        const clusterSpacing = 20
        const groupPadding = 40
        const headerHeight = 80

        // Calculate optimal grid layout for super clusters
        const superClustersPerRow = Math.min(
          3,
          Math.max(1, Math.ceil(Math.sqrt(totalSuperClusters)))
        )

        // Calculate maximum clusters per group for sizing
        const maxClustersPerGroup = Math.max(...clustersPerGroup)
        const maxClustersPerRow = Math.max(
          2,
          Math.min(4, Math.ceil(Math.sqrt(maxClustersPerGroup)))
        )
        const maxRows = Math.ceil(maxClustersPerGroup / maxClustersPerRow)

        // Calculate minimum group dimensions
        const minGroupWidth = Math.max(
          400,
          maxClustersPerRow * clusterNodeWidth +
            (maxClustersPerRow - 1) * clusterSpacing +
            groupPadding * 2
        )
        const minGroupHeight = Math.max(
          350,
          headerHeight +
            maxRows * clusterNodeHeight +
            (maxRows - 1) * clusterSpacing +
            groupPadding * 2
        )

        // Spacing between groups
        const groupSpacingX = minGroupWidth + 100
        const groupSpacingY = minGroupHeight + 80

        return {
          superClustersPerRow,
          minGroupWidth: Math.round(minGroupWidth),
          minGroupHeight: Math.round(minGroupHeight),
          groupSpacingX: Math.round(groupSpacingX),
          groupSpacingY: Math.round(groupSpacingY),
          maxClustersPerGroup,
          maxClustersPerRow,
          maxRows,
        }
      }

      function renderScenario(title, description, totalSuperClusters, clustersPerGroup) {
        const layout = calculateLayout(totalSuperClusters, clustersPerGroup)

        const div = document.createElement('div')
        div.className = 'scenario'

        div.innerHTML = `
                <h3>${title}</h3>
                <p>${description}</p>
                <div><strong>Layout Results:</strong></div>
                <ul>
                    <li>Super clusters per row: ${layout.superClustersPerRow}</li>
                    <li>Min group size: ${layout.minGroupWidth}×${layout.minGroupHeight}px</li>
                    <li>Group spacing: ${layout.groupSpacingX}×${layout.groupSpacingY}px</li>
                    <li>Max clusters per group: ${layout.maxClustersPerGroup}</li>
                    <li>Max clusters per row: ${layout.maxClustersPerRow}</li>
                    <li>Max rows in group: ${layout.maxRows}</li>
                </ul>
                <div><strong>Visual Representation:</strong></div>
                <div class="grid" style="grid-template-columns: repeat(${layout.superClustersPerRow}, 1fr); max-width: 800px;">
                    ${Array.from(
                      { length: totalSuperClusters },
                      (_, i) => `
                        <div class="group" style="min-width: ${Math.round(layout.minGroupWidth / 4)}px; min-height: ${Math.round(layout.minGroupHeight / 4)}px;">
                            <div style="font-weight: bold; margin-bottom: 5px;">Group ${i + 1}</div>
                            <div class="grid" style="grid-template-columns: repeat(${Math.min(clustersPerGroup[i], 4)}, 1fr); gap: 2px;">
                                ${Array.from(
                                  { length: clustersPerGroup[i] },
                                  (_, j) => `
                                    <div class="cluster">C${j + 1}</div>
                                `
                                ).join('')}
                            </div>
                        </div>
                    `
                    ).join('')}
                </div>
            `

        document.getElementById('scenarios').appendChild(div)
      }

      // Test scenarios
      renderScenario(
        'Small Layout: 2 Super Clusters',
        'Few super clusters with moderate sub-clusters each',
        2,
        [3, 5]
      )

      renderScenario(
        'Medium Layout: 4 Super Clusters',
        'Medium number of super clusters with varying sub-cluster counts',
        4,
        [2, 8, 4, 6]
      )

      renderScenario(
        'Large Layout: 6 Super Clusters',
        'Many super clusters including one with many sub-clusters',
        6,
        [3, 12, 2, 7, 4, 5]
      )

      renderScenario(
        'Extra Large Layout: 9 Super Clusters',
        'Maximum realistic number of super clusters with various sizes',
        9,
        [4, 6, 15, 3, 8, 2, 9, 5, 7]
      )
    </script>
  </body>
</html>
